# Override agar docker-compose.prod.yml bisa dijalankan di lokal (Dokploy TIDAK dipakai).
#
# Compose produksi memakai network external `dokploy-network` (punya Traefik di server).
# Di lokal, buat network itu sekali saja:
#
#   docker network create dokploy-network
#
# Lalu jalankan:
#
#   DATABASE_PASSWORD=postgres JWT_SECRET=local-dev-secret-please-change-32chars \
#   NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1 \
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.local.yml up -d --build
#
# container_name sengaja hanya diisi di sini (mode lokal). Dokploy melarangnya,
# karena bikin masalah log, metrics, dan fitur lain.
services:
  postgres:
    container_name: himatris-oprec-postgres

  redis:
    container_name: himatris-oprec-redis

  backend:
    container_name: himatris-oprec-backend
    ports:
      - "8080:8080"
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BASE_URL: ${BASE_URL:-http://localhost:8080}

  frontend:
    container_name: himatris-oprec-frontend
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"
