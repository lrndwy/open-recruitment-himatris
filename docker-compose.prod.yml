services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-himatris_oprec}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-himatris_oprec}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - internal

  # Cache konten publik + pembatas permintaan. Tanpa volume dan tanpa persistensi
  # karena isinya bisa dibangun ulang; memori dibatasi supaya tidak menelan RAM server.
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-himatris_oprec}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD required}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
      STORAGE_PATH: /app/storage
      MAX_CV_SIZE: ${MAX_CV_SIZE:-5242880}
      FRONTEND_URL: ${FRONTEND_URL:-https://oprec.himatris.com}
      BASE_URL: ${BASE_URL:-https://oprec.himatris.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - cv_storage:/app/storage
    restart: always
    # internal: agar bisa menghubungi postgres/redis.
    # dokploy-network: supaya Traefik bisa merutekan domain ke service ini.
    networks:
      - internal
      # - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://oprec.himatris.com/api/v1}
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - internal
      # - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  cv_storage:

networks:
  internal:
    driver: bridge
  # # Network milik Traefik/Dokploy yang sudah ada di server. Tanpa ini domain
  # # tidak bisa diakses (Traefik membalas 404 karena tidak menemukan service).
  # dokploy-network:
  #   external: true
