services:
  postgres:
    image: postgres:17-alpine
    container_name: himatris-oprec-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-himatris_oprec}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-himatris_oprec}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: himatris-oprec-backend
    environment:
      PORT: "8080"
      ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-himatris_oprec}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
      STORAGE_PATH: /app/storage
      MAX_CV_SIZE: ${MAX_CV_SIZE:-5242880}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cv_storage:/app/storage
    restart: always
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: himatris-oprec-frontend
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://oprec.himatris.com/api/v1}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - internal

volumes:
  postgres_data:
  cv_storage:

networks:
  internal:
    driver: bridge
