services:
  postgres:
    image: postgres:17-alpine
    container_name: himatris-oprec-postgres
    environment:
      POSTGRES_DB: himatris_oprec
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - himatris_oprec_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d himatris_oprec"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: himatris-oprec-backend
    environment:
      PORT: "8080"
      ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: himatris_oprec
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: "86400"
      STORAGE_PATH: /app/storage
      MAX_CV_SIZE: "5242880"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - cv_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    container_name: himatris-oprec-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  himatris_oprec_pgdata:
  cv_storage:
